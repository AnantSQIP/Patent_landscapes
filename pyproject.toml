[project]
name = "patsquire-plr"
version = "0.1.0"
description = "Patsquire automated Patent Landscape Report (PLR) system"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14",
    "anthropic>=1.8",
    "boto3>=1.35",
    "google-genai>=2.25",
    "openai>=3.19",
    "pdfplumber>=0.11",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "redis>=5.2",
    "sqlalchemy>=2.0.36",
    "structlog>=24.4",
    "typer>=0.15",
]

[project.scripts]
plr = "patsquire_plr.cli:app"

[dependency-groups]
dev = [
    "boto3-stubs[bedrock-runtime,s3]>=1.35",
    "fpdf2>=2.8",
    "hypothesis>=6.120",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "testcontainers[postgres,redis,minio]>=4.9",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patsquire_plr"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "S", "BLE", "A", "C4", "SIM",
    "RET", "PTH", "PL", "RUF", "TRY", "ERA", "ANN", "PT", "T20",
]
ignore = [
    "TRY003",   # long messages in exceptions are wanted: failures must explain themselves
    "PLR0913",  # explicit keyword arguments are clearer than bundling them
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ANN401"]
# Autogenerated migrations embed SQL constraint text verbatim.
"src/patsquire_plr/db/migrations/versions/**" = ["E501"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_explicit = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
# No type information shipped; calls into these are wrapped in typed functions.
module = ["testcontainers.*", "pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "integration: needs real services started via testcontainers (requires Docker)",
]
filterwarnings = ["error"]
xfail_strict = true

[tool.coverage.run]
source = ["patsquire_plr"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
