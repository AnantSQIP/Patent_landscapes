# Non-secret settings for local development against docker-compose.
# Every key is required. Secrets (database.password, object_storage.access_key_id,
# object_storage.secret_access_key) are NOT allowed here: set them in .env or the
# environment, e.g. PLR__DATABASE__PASSWORD. See .env.example.
# Any key can be overridden by PLR__<SECTION>__<KEY> environment variables.

app:
  environment: dev
  log_level: INFO

database:
  host: localhost
  port: 55432
  name: plr
  user: plr
  connect_timeout_s: 5

redis:
  host: localhost
  port: 56379
  db: 0
  password: null  # local Redis runs without auth; set PLR__REDIS__PASSWORD in production
  socket_timeout_s: 5

object_storage:
  endpoint_url: http://localhost:59000
  region: us-east-1
  bucket: plr-artifacts
  connect_timeout_s: 5
  read_timeout_s: 10

# Model backends and roles (build prompt §4). Change where models run by editing this block
# only. API keys are never written here: api_key_env names the environment variable (in
# .env or the process environment) that holds the key.
models:
  backends:
    local_ollama:              # on-prem CPU/GPU via Ollama's OpenAI-compatible API
      type: openai_compatible
      base_url: http://localhost:11434/v1
      api_key_env: null        # Ollama needs no key
      region: null
      max_tokens_field: max_tokens   # Ollama/vLLM accept max_tokens
      timeout_s: 120
      max_retries: 2
      requests_per_minute: 120
  roles:
    embedding:
      {backend: local_ollama, model: "all-minilm:22m", max_output_tokens: null, temperature: null, seed: null, max_schema_retries: 0, input_price_per_mtok_usd: null, output_price_per_mtok_usd: null}
    bulk_classifier:
      {backend: local_ollama, model: "qwen2.5:0.5b", max_output_tokens: 512, temperature: 0, seed: 7, max_schema_retries: 2, input_price_per_mtok_usd: null, output_price_per_mtok_usd: null}
    reasoner:
      {backend: local_ollama, model: "qwen2.5:0.5b", max_output_tokens: 2048, temperature: 0, seed: 7, max_schema_retries: 2, input_price_per_mtok_usd: null, output_price_per_mtok_usd: null}
    writer:
      {backend: local_ollama, model: "qwen2.5:0.5b", max_output_tokens: 2048, temperature: 0, seed: 7, max_schema_retries: 2, input_price_per_mtok_usd: null, output_price_per_mtok_usd: null}
    critic:
      {backend: local_ollama, model: "qwen2.5:0.5b", max_output_tokens: 1024, temperature: 0, seed: 7, max_schema_retries: 2, input_price_per_mtok_usd: null, output_price_per_mtok_usd: null}
