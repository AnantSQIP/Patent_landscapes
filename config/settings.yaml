# Non-secret settings for local development against docker-compose.
# Every key is required. Secrets (database.password, object_storage.access_key_id,
# object_storage.secret_access_key) are NOT allowed here: set them in .env or the
# environment, e.g. PLR__DATABASE__PASSWORD. See .env.example.
# Any key can be overridden by PLR__<SECTION>__<KEY> environment variables.

app:
  environment: dev
  log_level: INFO

database:
  host: localhost
  port: 55432
  name: plr
  user: plr
  connect_timeout_s: 5

redis:
  host: localhost
  port: 56379
  db: 0
  password: null  # local Redis runs without auth; set PLR__REDIS__PASSWORD in production
  socket_timeout_s: 5

object_storage:
  endpoint_url: http://localhost:59000
  region: us-east-1
  bucket: plr-artifacts
  connect_timeout_s: 5
  read_timeout_s: 10

# Model backends and roles (build prompt §4). Change where models run by editing this block
# only. API keys are never written here: api_key_env names the environment variable (in
# .env or the process environment) that holds the key.
models:
  backends:
    local_ollama:              # on-prem CPU/GPU via Ollama's OpenAI-compatible API
      type: openai_compatible
      base_url: http://localhost:11434/v1
      api_key_env: null        # Ollama needs no key
      region: null
      max_tokens_field: max_tokens   # Ollama/vLLM accept max_tokens
      timeout_s: 900           # CPU-only inference of a 3B model can take minutes
      max_retries: 2
      requests_per_minute: 120
  roles:
    embedding:
      {backend: local_ollama, model: "all-minilm:22m", max_output_tokens: null, temperature: null, seed: null, max_schema_retries: 0, input_price_per_mtok_usd: null, output_price_per_mtok_usd: null}
    bulk_classifier:
      {backend: local_ollama, model: "qwen2.5:3b", max_output_tokens: 512, temperature: 0, seed: 7, max_schema_retries: 2, input_price_per_mtok_usd: null, output_price_per_mtok_usd: null}
    reasoner:
      {backend: local_ollama, model: "qwen2.5:3b", max_output_tokens: 4096, temperature: 0, seed: 7, max_schema_retries: 2, input_price_per_mtok_usd: null, output_price_per_mtok_usd: null}
    writer:
      {backend: local_ollama, model: "qwen2.5:0.5b", max_output_tokens: 2048, temperature: 0, seed: 7, max_schema_retries: 2, input_price_per_mtok_usd: null, output_price_per_mtok_usd: null}
    critic:
      {backend: local_ollama, model: "qwen2.5:0.5b", max_output_tokens: 1024, temperature: 0, seed: 7, max_schema_retries: 2, input_price_per_mtok_usd: null, output_price_per_mtok_usd: null}

# Patent data sources (build prompt §6, ADR 0005). A report run names the source IDs to use.
data_sources:
  google_patents:
    type: google_patents_page
    base_url: https://patents.google.com
    user_agent: "patsquire-plr/0.1 (patent landscape research)"
    requests_per_minute: 20
    timeout_s: 30
    max_retries: 2

# Landscape preparation: taxonomy and key strings (Phase 5, ADR 0010).
landscape:
  approval_mode: human          # human | automatic (minimum-interaction mode)
  max_segments: 8
  cpc_candidates_per_segment: 30   # official CPC entries offered to the model per segment
  max_cpc_per_segment: 8
  citation_expansion:
    max_hops: 2
    max_fetch_per_hop: 600      # at 20 requests/minute, about 30 minutes per full hop
    directions: [backward, forward]

# Relevance filtering and segment classification (Phase 6, ADR 0011). Thresholds are exact
# decimals; scores are cosine similarities of the embedding model, rounded to 4 places.
classification:
  seed: 7
  relevance:
    # Calibrated 2026-09-26 (all-minilm, LLM taxonomy): the 9 owner-confirmed LLM patents
    # scored 0.4505-0.6774; the owner's 1,131 unrelated patents: median 0.1894, 99th
    # percentile 0.4080, maximum 0.4955. Nothing unrelated reached 0.50; all 9 are above 0.35.
    high_threshold: "0.5000"
    low_threshold: "0.3500"
    qa_sample_rate: "0.1000"
    min_judge_confidence: medium
  segments:
    embedding_threshold: "0.4500"
  evaluation:
    min_gold_labels: 100
    min_precision: "0.8000"
    min_recall: "0.8000"
    min_segment_f1: "0.7000"
